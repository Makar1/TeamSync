services:
  db:
    image: postgres:16-alpine
    container_name: team_manager_db
    environment:
      POSTGRES_USER: team_manager
      POSTGRES_PASSWORD: team_manager_pass
      POSTGRES_DB: team_manager_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
